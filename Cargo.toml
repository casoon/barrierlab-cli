[package]
name = "barrierlab-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Accessibility audit of a web page from its source, without a browser."
authors = ["Jörn Seidel <info@casoon.de>"]
repository = "https://github.com/casoon/barrierlab-cli"
homepage = "https://casoon.github.io/barrierlab-cli/"

[[bin]]
name = "barrierlab"
path = "src/main.rs"

[dependencies]
# One barrierlab release line for all of them, so only one copy of each crate
# exists (`cargo tree -d` shows it).
a11y-report = "0.30"
a11y-static = "0.5"
runemark = "0.10"
# preserve_order keeps the field order of the report when the finding ids are added.
serde_json = { version = "1", features = ["preserve_order"] }
ureq = "3"
url = "2"
