[package]
name = "barrierlab-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Accessibility audit of a web page from its source, without a browser."
authors = ["Jörn Seidel <info@casoon.de>"]
repository = "https://github.com/casoon/barrierlab-cli"
homepage = "https://casoon.github.io/barrierlab-cli/"

[[bin]]
name = "barrierlab"
path = "src/main.rs"

[dependencies]
# Temporary: the barrierlab crates are pinned to one git revision until
# a11y-static and style-cascade are on crates.io. One rev for all of them, so
# only one copy of each crate exists. See README, "Dependencies".
a11y-report = { git = "https://github.com/casoon/barrierlab", rev = "0300eb671175f10b92035161ca8ea66589e9c97f" }
a11y-static = { git = "https://github.com/casoon/barrierlab", rev = "0300eb671175f10b92035161ca8ea66589e9c97f" }
runemark = "0.9.1"
serde_json = "1"
ureq = "3"
url = "2"
