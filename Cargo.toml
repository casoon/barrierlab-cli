[package]
name = "barrierlab-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Accessibility audit of a web page from its source, without a browser."
authors = ["Jörn Seidel <info@casoon.de>"]

[[bin]]
name = "barrierlab"
path = "src/main.rs"

[dependencies]
a11y-dom = "0.26.1"
a11y-report = "0.26.1"
a11y-rules = { version = "0.26.1", default-features = false }
accname = "0.26.1"
html5-parser = "0.4.1"
runemark = "0.9.1"
style-cascade = "0.1.0"
stylesheet-parse = "0.1.0"
serde_json = "1"
ureq = "3"
url = "2"

# Until style-cascade is published: local packages. Remove once the registry
# versions exist.
[patch.crates-io]
a11y-dom = { path = "../barrierlab/crates/a11y-dom" }
stylesheet-parse = { path = "../barrierlab/crates/stylesheet-parse" }
media-query-parse = { path = "../barrierlab/crates/media-query-parse" }
style-cascade = { path = "../barrierlab/crates/style-cascade" }
